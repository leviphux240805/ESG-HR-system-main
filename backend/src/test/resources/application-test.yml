springdoc:
  # OpenApiSnapshotTests ghi frontend/openapi.json
  api-docs:
    enabled: true

app:
  auth:
    jwt-secret: test-only-secret-0123456789abcdefghijklmnop
    refresh-cookie-secure: false
    # Mọi test MockMvc chung một IP: nới giới hạn theo IP (LoginRateLimiterTests kiểm riêng)
    login-max-attempts-per-ip: 100000
  storage:
    # endpoint/access-key/secret-key do TestcontainersConfiguration đặt theo container MinIO
    bucket: test-files
    create-bucket: true
    max-size-bytes: 1048576
  jobs:
    # Test gọi trực tiếp service của job; không để lịch @Scheduled chạy xen giữa
    enabled: false
