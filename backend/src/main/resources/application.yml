spring:
  application:
    name: preschool
  profiles:
    default: dev
  config:
    # Cho phép dùng chung file .env ở gốc repo với docker compose
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:preschool}
    username: ${DB_USERNAME:preschool}
    password: ${DB_PASSWORD:preschool}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${SERVER_PORT:8081}

app:
  auth:
    # Bắt buộc đặt JWT_SECRET (>= 32 ký tự) ngoài môi trường dev/test
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-secure: ${COOKIE_SECURE:true}
  storage:
    # Trình duyệt dùng trực tiếp địa chỉ này để PUT/GET file, nên phải truy cập được từ máy người dùng
    endpoint: ${S3_ENDPOINT:http://localhost:${S3_PORT:9000}}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:preschool}
    secret-key: ${S3_SECRET_KEY:preschool-secret}
    bucket: ${S3_BUCKET:preschool}

springdoc:
  # Thứ tự key ổn định để snapshot frontend/openapi.json không đổi vô cớ
  writer-with-order-by-keys: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
