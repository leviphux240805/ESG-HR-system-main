spring:
  application:
    name: preschool
  profiles:
    default: dev
  config:
    # Cho phép dùng chung file .env ở gốc repo với docker compose
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:preschool}
    username: ${DB_USERNAME:preschool}
    password: ${DB_PASSWORD:preschool}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh

server:
  port: ${SERVER_PORT:8081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
