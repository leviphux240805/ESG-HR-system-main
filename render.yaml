# Render Blueprint: backend Spring Boot; PostgreSQL ở Neon. Frontend (Vercel) chuyển tiếp /api tới service này.
services:
  - type: web
    name: preschool-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        value: neondb
      - key: DB_USERNAME
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: FRONTEND_URL
        sync: false
      # File: Cloudflare R2 (S3). Endpoint https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: preschool
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      # Email: Brevo SMTP. Render free chặn cổng 25/465/587 nên dùng 2525
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
