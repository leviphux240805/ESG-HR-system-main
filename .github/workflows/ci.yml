name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers dùng Docker có sẵn trên runner; gồm test chặn truy cập chéo cơ sở
      - run: ./mvnw -B test
      - name: Snapshot OpenAPI đã được commit
        run: git diff --exit-code -- ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type sinh từ OpenAPI khớp snapshot
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - run: npm test
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Hạ tầng (Postgres, MinIO, Mailpit)
        run: docker compose up -d --wait
      - name: Backend profile dev (có seed), chờ sẵn sàng
        working-directory: backend
        run: |
          nohup ./mvnw -B -q spring-boot:run > backend.log 2>&1 &
          for i in $(seq 1 90); do
            curl -sf http://localhost:8081/v3/api-docs > /dev/null && exit 0
            sleep 2
          done
          cat backend.log
          exit 1
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run e2e
      - name: Lưu báo cáo khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/backend.log
