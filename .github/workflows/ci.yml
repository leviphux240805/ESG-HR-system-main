name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers dùng Docker có sẵn trên runner; gồm test chặn truy cập chéo cơ sở
      - run: ./mvnw -B test
      - name: Snapshot OpenAPI đã được commit
        run: git diff --exit-code -- ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type sinh từ OpenAPI khớp snapshot
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run build
